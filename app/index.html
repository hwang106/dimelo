<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dímelo</title>
<meta name="description" content="Learn fast Dominican Spanish: ear training, slang, and the phrases a Washington Heights teacher needs.">
<meta name="theme-color" content="#58cc02">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Dímelo</span></div>
  <div class="chips">
    <span class="chip streak" title="Streak">🔥 <b id="streak">0</b></span>
    <span class="chip" title="Cheles">🪙 <b id="cheles">0</b></span>
    <span class="chip goal"><span id="goalring" class="ring"></span><b id="goaltxt">0/30</b></span>
    <button id="syncBtn" class="chip sync" hidden aria-label="OneDrive sync">☁️</button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="learn"><span>🏠</span>Learn</button>
  <button data-tab="practice"><span>🧠</span>Practice</button>
  <button data-tab="clips"><span>🎬</span>Clips</button>
  <button data-tab="partner"><span>💬</span>Talk</button>
  <button data-tab="me"><span>🙂</span>Me</button>
</nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
